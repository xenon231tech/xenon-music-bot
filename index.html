<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .app-container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }
        
        .input-section, .controls, .search-box, .task-input {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        input, select, button {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        button {
            background: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        .stat-card {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 10px;
        }
        
        .stat-card h2 {
            margin: 10px 0;
            font-size: 24px;
        }
        
        .card {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
        }
        
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        
        .nfts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .nft-card {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            background: #f9f9f9;
        }
        
        .expense-item, .task-item, .crypto-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f0f0f0;
            margin: 5px 0;
            border-radius: 5px;
        }
        
        .playlist {
            margin-top: 20px;
        }
        
        .block {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .block:hover {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="app-container">
            <h1>🎵 Music Player</h1>
            <div class="player">
                <div class="player-display">
                    <div class="album-art">🎵</div>
                    <div class="song-info">
                        <h2 id="song-title">Now Playing</h2>
                        <p id="song-artist">Artist Name</p>
                    </div>
                </div>
                <div class="controls">
                    <button onclick="previousSong()">⏮</button>
                    <button onclick="togglePlay()" id="play-btn">▶</button>
                    <button onclick="nextSong()">⏭</button>
                </div>
                <div class="volume-control">
                    <label>Volume</label>
                    <input type="range" min="0" max="100" value="50" id="volume">
                </div>
                <div class="playlist">
                    <h3>Playlist</h3>
                    <div id="playlist-items"></div>
                </div>
            </div>
        </div>
    <script src="script.js"></script>
</body>
</html>
